name: Release skills

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate release tag and main ancestry
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Create GitHub release with installation instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_SHA="$(git rev-parse HEAD)"
          cat > "$RUNNER_TEMP/skills-release.md" <<EOF
          Install a skill from this release:

          \`\`\`sh
          npx skills add https://github.com/laserjm/skills/tree/$RELEASE_TAG --skill isolated-worktree-setup
          \`\`\`

          Commit the installed skill files and skills-lock.json.
          EOF
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" --generate-notes --notes-file "$RUNNER_TEMP/skills-release.md"
