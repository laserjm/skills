name: Release skills

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.8.0
      - name: Validate release tag and main ancestry
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match the stable version in package.json.');
          }
          NODE
          git merge-base --is-ancestor HEAD origin/main
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Create GitHub release with the immutable installation pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export RELEASE_SHA="$(git rev-parse HEAD)"
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          import path from 'node:path';
          const pin = `github:laserjm/skills#${process.env.RELEASE_SHA}`;
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'skills-release.md'),
            `Install this tested commit:\n\n\`\`\`json\n"@laserjm/skills": "${pin}"\n\`\`\`\n\n` +
            'Run skills:sync and skills:check, then commit the dependency, lockfile, installed files, and receipt together.\n');
          NODE
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" --generate-notes --notes-file "$RUNNER_TEMP/skills-release.md"
