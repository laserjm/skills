name: Skills drift

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    name: Skills drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.13.1'
          cache: npm
      - run: npm install --global npm@11.8.0
      # Configure private Git access here if required by skills or other deps.
      - run: npm ci --include=dev
      # Verification must run before any sync; CI reports drift instead of fixing it.
      - run: npm run skills:check
